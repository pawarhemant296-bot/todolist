<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <style>
    :root {
      --paper: #EEF2F9;
      --card: #FFFFFF;
      --ink: #132038;
      --muted: #5C6B85;
      --line: #D9E0EE;
      --accent: #2B59FF;
      --accent-ink: #FFFFFF;
      --done: #1E9A6A;
      --danger: #C23B3B;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0D1424;
        --card: #16213B;
        --ink: #E8EDF8;
        --muted: #98A6C4;
        --line: #26345C;
        --accent: #7A96FF;
        --accent-ink: #0D1424;
        --done: #4CC995;
        --danger: #FF8080;
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
      padding: 48px 16px;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
    }

    header { padding: 28px 28px 20px; }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    #summary {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meter { height: 6px; background: var(--line); }
    #bar {
      height: 100%;
      width: 0;
      background: var(--done);
      transition: width 0.35s ease;
    }

    #add {
      display: flex;
      gap: 10px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }

    #title {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: inherit;
      background: var(--paper);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 14px;
    }
    #title::placeholder { color: var(--muted); }
    #title:focus { outline: none; border-color: var(--accent); }

    .primary {
      font: inherit;
      font-weight: 700;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      cursor: pointer;
    }
    .primary:hover { filter: brightness(1.08); }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 14px 28px 4px;
    }

    .filters button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--paper);
    }

    ul { list-style: none; margin: 0; padding: 8px 16px 8px; }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 12px;
    }
    li:hover { background: var(--paper); }

    .check {
      flex: none;
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      border: 2px solid var(--muted);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .check svg { width: 16px; height: 16px; }
    .check path {
      fill: none;
      stroke: var(--card);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 0.25s ease 0.05s;
    }
    li.done .check { background: var(--done); border-color: var(--done); }
    li.done .check path { stroke-dashoffset: 0; }

    .text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 0 2px;
      transition: background-size 0.3s ease, color 0.3s;
    }
    li.done .text {
      color: var(--muted);
      background-size: 100% 2px;
    }

    .delete {
      flex: none;
      font: inherit;
      font-size: 0.85rem;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .delete:hover { color: var(--danger); }

    #empty {
      margin: 0;
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      display: flex;
      justify-content: flex-end;
      padding: 8px 28px 20px;
    }
    #clear {
      font: inherit;
      font-size: 0.9rem;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #clear:hover:not(:disabled) { color: var(--danger); }
    #clear:disabled { opacity: 0.4; cursor: default; }

    #error {
      margin: 0;
      padding: 12px 28px;
      color: var(--danger);
      border-top: 1px solid var(--line);
    }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 16px 8px; }
      header, #add, .filters, footer { padding-left: 16px; padding-right: 16px; }
      ul { padding-left: 4px; padding-right: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>To-do list</h1>
      <p id="summary" aria-live="polite"></p>
    </header>
    <div class="meter" aria-hidden="true"><div id="bar"></div></div>

    <form id="add">
      <input id="title" type="text" maxlength="200" placeholder="Add a task" aria-label="New task" autocomplete="off" required>
      <button class="primary" type="submit">Add task</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list"></ul>
    <p id="empty" hidden></p>

    <footer>
      <button id="clear" type="button">Clear completed</button>
    </footer>

    <p id="error" role="alert" hidden></p>
  </main>

  <script>
    const API = '/api/tasks';
    const $ = (id) => document.getElementById(id);

    let tasks = [];
    let filter = 'all';

    // ---- talking to the Java server ------------------------------------
    async function request(url, options) {
      try {
        const res = await fetch(url, options);
        if (!res.ok) {
          let message = 'Something went wrong. Try again.';
          try { message = (await res.json()).error || message; } catch (_) {}
          throw new Error(message);
        }
        showError('');
        return await res.json();
      } catch (err) {
        showError(err instanceof TypeError
          ? "Can't reach the server. Check that TodoServer is still running."
          : err.message);
        return null;
      }
    }

    function showError(message) {
      const el = $('error');
      el.textContent = message;
      el.hidden = !message;
    }

    async function loadTasks() {
      const data = await request(API);
      if (data) { tasks = data; render(); }
    }

    async function addTask(title) {
      const task = await request(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain; charset=utf-8' },
        body: title
      });
      if (task) { tasks.push(task); render(); return true; }
      return false;
    }

    async function toggleTask(id) {
      const updated = await request(`${API}/${id}`, { method: 'PATCH' });
      if (updated) {
        tasks = tasks.map((t) => (t.id === id ? updated : t));
        render();
      }
    }

    async function removeTask(id) {
      const result = await request(`${API}/${id}`, { method: 'DELETE' });
      if (result) { tasks = tasks.filter((t) => t.id !== id); render(); }
    }

    async function clearCompleted() {
      const data = await request(API, { method: 'DELETE' });
      if (data) { tasks = data; render(); }
    }

    // ---- drawing the page ----------------------------------------------
    function render() {
      const total = tasks.length;
      const doneCount = tasks.filter((t) => t.done).length;
      const remaining = total - doneCount;

      $('summary').textContent = total === 0
        ? 'No tasks yet'
        : remaining === 0
          ? `All ${total} done`
          : `${remaining} left of ${total}`;
      $('bar').style.width = total ? (doneCount / total) * 100 + '%' : '0';
      $('clear').disabled = doneCount === 0;

      const visible = tasks.filter((t) =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done);

      const list = $('list');
      list.replaceChildren();

      visible.forEach((task) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const check = document.createElement('button');
        check.type = 'button';
        check.className = 'check';
        check.setAttribute('role', 'checkbox');
        check.setAttribute('aria-checked', String(task.done));
        check.setAttribute('aria-label', task.title);
        check.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
        check.addEventListener('click', () => toggleTask(task.id));

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = task.title; // textContent keeps user input safe from HTML injection

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', `Delete ${task.title}`);
        del.addEventListener('click', () => removeTask(task.id));

        li.append(check, text, del);
        list.append(li);
      });

      const empty = $('empty');
      if (visible.length === 0) {
        empty.hidden = false;
        empty.textContent = total === 0
          ? 'Nothing here yet. Add your first task above.'
          : filter === 'done'
            ? 'No completed tasks yet.'
            : 'No active tasks. Nice work.';
      } else {
        empty.hidden = true;
      }
    }

    // ---- events --------------------------------------------------------
    $('add').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('title');
      const title = input.value.trim();
      if (!title) return;
      if (await addTask(title)) {
        input.value = '';
        input.focus();
      }
    });

    document.querySelectorAll('.filters button').forEach((btn) => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filters button').forEach((b) =>
          b.setAttribute('aria-pressed', String(b === btn)));
        render();
      });
    });

    $('clear').addEventListener('click', clearCompleted);

    loadTasks();
  </script>
</body>
</html>
